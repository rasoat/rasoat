# A tag vX.Y.Z builds the binaries here, on GitHub's runners, and attests each one: `gh attestation verify` proves a
# download came from this workflow in this repository. Actions are pinned by commit.
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: The tag is the program's version
        run: test "$(bun apps/cli/src/main.ts --version)" = "${GITHUB_REF_NAME#v}"
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cli/rasoat-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/cli/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
